[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgp-generative-ai-demos"
version = "0.1.0"
description = "Exploratory demos and reusable projects for a PGP Generative AI class"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/class_demos_ai"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11", "ty>=0.0.1"]
notebooks = ["ipykernel>=6.29", "jupyter>=1.1"]
agentic = []
api = ["fastapi>=0.115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]